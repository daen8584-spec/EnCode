<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f3f6fc">
    <title>Trilhas | EnCoder</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&family=Jersey+10&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mascot.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/vale.css">
    <link rel="stylesheet" href="css/clean.css">
    <script type="module" src="js/vale.js"></script>
    <script type="module" src="js/lessons.js"></script>
</head>
<body class="is-loading">
    <header class="map-header">
        <a class="back" href="dashboard.html#home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            <span>Painel</span>
        </a>
        <h1>Trilhas</h1>
        <div class="hud">
            <span class="hud-chip is-streak" title="Dias seguidos">
                <svg class="px-icon" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M9 2h2v4H9zM7 6h2v2H7zM5 8h2v2H5zm8 2h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2zm2 2h2v6h-2zM3 10h2v8H3zm8-4h2v4h-2zm6 12h2v2h-2zM7 20h10v2H7zm-2-2h2v2H5zm4-2h6v4H9z"/> <path d="M11 14h2v3h-2z"/></svg>
                <b id="hud-streak">0</b>
            </span>
            <span class="hud-chip is-xp" title="XP total">
                <svg class="px-icon" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 13h8v6h2v2h-2v2h-2v-8H2v-4h2v2Zm12 6h-2v-2h2v2Zm2-2h-2v-2h2v2Zm2-2h-2v-2h2v2Zm-6-6h8v4h-2v-2h-8V5h-2V3h2V1h2v8Zm-8 2H4V9h2v2Zm2-2H6V7h2v2Zm2-2H8V5h2v2Z"/></svg>
                <b id="hud-xp">0</b>
            </span>
        </div>
    </header>

    <main class="map">
        <nav class="track-picker" id="tabs" aria-label="Escolha a trilha"></nav>
        <div class="map-body">
            <div class="units" id="units"></div>
            <aside class="map-side" id="side" aria-label="Resumo da trilha"></aside>
        </div>
    </main>
</body>
</html>
