<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f3f6fc">
    <title>Trilhas | EnCoder</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Jersey+10&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mascot.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/oficina.css">
    <link rel="stylesheet" href="css/vale.css">
    <script type="module" src="js/vale.js"></script>
    <script type="module" src="js/lessons.js"></script>
</head>
<body class="is-loading">
    <header class="map-header">
        <a class="back" href="dashboard.html#home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            <span>Painel</span>
        </a>
        <h1>Trilhas</h1>
        <div class="hud">
            <span class="hud-chip is-streak" title="Dias seguidos">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>
                <b id="hud-streak">0</b>
            </span>
            <span class="hud-chip is-xp" title="XP total">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
                <b id="hud-xp">0</b>
            </span>
        </div>
    </header>

    <main class="map">
        <nav class="track-picker" id="tabs" aria-label="Escolha a trilha"></nav>
        <div class="map-body">
            <div class="units" id="units"></div>
            <aside class="map-side" id="side" aria-label="Resumo da trilha"></aside>
        </div>
    </main>
</body>
</html>
