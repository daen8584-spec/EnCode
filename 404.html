<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6fc">
    <title>Página não encontrada | EnCoder</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Jersey+10&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">

<body class="lost">
    <div class="valley is-page" aria-hidden="true">
        <div class="sky" data-sun="center"><svg class="sky-art" shape-rendering="crispEdges"></svg></div>
        <svg class="drifts" shape-rendering="crispEdges" preserveAspectRatio="none"></svg>
        <div class="snow"></div>
    </div>
    <main class="auth-main is-standalone">
        <section class="auth-card card lost-card">
            <svg class="snowcap" aria-hidden="true" shape-rendering="crispEdges" preserveAspectRatio="none"></svg>
            <div class="lost-trail" aria-hidden="true"><span class="lost-steps"></span><span class="lost-sign">?</span><span class="lost-fox"></span></div>
            <p class="brand is-large"><span class="logo" aria-hidden="true"></span>EnCoder</p>
            <h1>Página não encontrada</h1>
            <p class="muted">Este lugar não está no mapa. O endereço pode estar errado ou a página foi removida.</p>
            <a class="button" href="/dashboard.html">Voltar ao início</a>
