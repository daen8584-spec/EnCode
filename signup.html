<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website description here">
    <title>Cadastro  EnCoder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css\login.css">
    <link rel="stylesheet" href="css\signup.css">
</head>
<body class="page-signup">
    <div class="background" aria-hidden="true">
        <div class="background-orb background-orb-left"></div>
        <div class="background-orb background-orb-right"></div>
        <div class="background-symbols">
            <span class="symbol">&lt;/&gt;</span>
            <span class="symbol">{ }</span>
            <span class="symbol">( )</span>
            <span class="symbol">;</span>
            <span class="symbol">=&gt;</span>
            <span class="symbol">#</span>
        </div>
    </div>
    <main class="login-page">
        <header class="login-header">
            <span class="login-logo">&lt;/&gt;</span>
            <h1 class="login-brand">EnCoder</h1>
        </header>
        <section class="login-card" aria-labelledby="signup-title">
            <h2 id="signup-title" class="login-title">Criar Conta</h2>
            <p class="login-subtitle">Page description here</p>
            <form id="signup-form" class="login-form">
                <div class="form-group">
                    <label class="login-label" for="signup-name">Nome</label>
                    <input class="login-input" id="signup-name" name="name" type="text" autocomplete="name" placeholder="Seu nome" minlength="2" required>
                </div>
                <div class="form-group">
                    <label class="login-label" for="signup-email">Email</label>
                    <input class="login-input" id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="login-label" for="signup-password">Senha</label>
                    <input class="login-input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required>
                    <div class="strength-meter" id="signup-strength-meter" hidden>
                        <div class="strength-meter-bar"></div>
                    </div>
                    <p class="strength-label" id="signup-strength-label" hidden aria-live="polite"></p>
                </div>
                <div class="form-group">
                    <label class="login-label" for="signup-password-confirm">Confirmar Senha</label>
                    <input class="login-input" id="signup-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required>
                </div>
                <label class="login-checkbox-label">
                    <input class="login-checkbox" type="checkbox" id="signup-terms" name="terms" required>
                    <span>Termos e Condições</span>
                </label>
                <button class="login-button" type="submit" id="signup-submit">
                    <span class="login-button-text">Criar Conta</span>
                    <span class="login-button-loader"></span>
                    <span class="login-button-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12.5l5 5L20 6.5"></path>
                        </svg>
                    </span>
                </button>
                <p id="signup-feedback" class="login-feedback" role="alert" hidden></p>
            </form>
            <p class="login-switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>
    <script type="module" src="signup.js"></script>
<script type="module" src="js/signup.js"></script>
</body>
</html>
