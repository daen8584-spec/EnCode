<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1222">
    <title>Lição · EnCoder</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Nunito:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/lesson.css">
    <script type="module" src="js/lesson.js"></script>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="lesson-header">
        <a class="icon-button" id="close" href="lessons.html" aria-label="Sair da lição">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </a>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="progress"></div></div>
    </header>

    <main class="lesson">
        <div class="lesson-content">
            <h1 id="title">Carregando…</h1>
            <p class="lesson-question" id="question"></p>
            <div id="step"></div>
        </div>
        <img class="lesson-mascot is-idle" id="mascot" src="assets/mascot.webp" width="440" height="536" alt="">
    </main>

    <footer class="lesson-footer">
        <p class="feedback" id="feedback" role="status" hidden></p>
        <button class="button lesson-action" id="action" type="button" disabled>Verificar</button>
    </footer>

    <dialog class="celebration" id="celebration" aria-labelledby="celebration-title">
        <svg class="celebration-star" viewBox="0 0 80 80" aria-hidden="true"><path d="M40 8l8 18h20l-16 12 6 20-18-12-18 12 6-20L12 26h20z"/></svg>
        <h2 id="celebration-title">Lição completa!</h2>
        <p class="celebration-xp">+<span id="xp-gained">0</span> XP</p>
        <div class="celebration-actions">
            <a class="button is-ghost" id="repeat" href="lessons.html">Repetir</a>
            <a class="button is-gold" id="next" href="lessons.html">Próxima lição</a>
        </div>
    </dialog>
</body>
</html>
