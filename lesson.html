<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6fc">
    <title>Lição | EnCoder</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Jersey+10&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mascot.css">
    <link rel="stylesheet" href="css/lesson.css">
    <link rel="stylesheet" href="css/oficina.css">
    <link rel="stylesheet" href="css/vale.css">
    <script type="module" src="js/vale.js"></script>
    <script type="module" src="js/lesson.js"></script>
</head>
<body>

    <header class="lesson-header">
        <a class="icon-button" id="close" href="lessons.html" aria-label="Sair da lição">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </a>
        <ol class="steps" id="steps" aria-label="Etapas da lição"></ol>
        <span class="combo" id="combo" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>
            <b id="combo-count">0</b>
        </span>
        <button class="icon-button" id="sound" type="button" aria-pressed="true" aria-label="Som ligado" title="Som">
            <svg class="is-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>
            <svg class="is-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></svg>
        </button>
    </header>

    <main class="lesson">
        <div class="lesson-content">
            <h1 id="title">Carregando...</h1>
            <span class="task-type" id="task-type" hidden></span>
            <p class="lesson-question" id="question"></p>
            <div id="step"></div>
        </div>
        <div class="lesson-mascot" id="mascot-slot"></div>
    </main>

    <footer class="lesson-footer" id="footer">
        <div class="feedback" id="feedback" role="status" hidden>
            <span class="feedback-icon" aria-hidden="true"></span>
            <div>
                <strong id="feedback-title"></strong>
                <p id="feedback-detail"></p>
            </div>
        </div>
        <button class="button lesson-action" id="action" type="button" disabled>Verificar</button>
    </footer>

    <dialog class="celebration" id="celebration" aria-labelledby="celebration-title">
        <div class="celebration-mascot bubble-right" id="celebration-mascot"></div>
        <h2 id="celebration-title">Lição completa!</h2>
        <div class="celebration-words" id="celebration-words" hidden>
            <span class="label">Palavras novas</span>
            <ul id="new-words"></ul>
        </div>
        <dl class="celebration-stats">
            <div class="stat is-xp"><dt>XP ganho</dt><dd>+<span id="xp-gained">0</span></dd></div>
            <div class="stat is-accuracy"><dt>Precisão</dt><dd><span id="accuracy">0</span>%</dd></div>
        </dl>
        <div class="celebration-extra" id="celebration-extra"></div>
        <div class="celebration-actions">
            <a class="button is-ghost" id="repeat" href="lessons.html">Repetir</a>
            <a class="button is-gold" id="next" href="lessons.html">Próxima lição</a>
        </div>
    </dialog>
</body>
</html>
