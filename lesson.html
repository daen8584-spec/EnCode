<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1222">
    <title>Lição · EnCoder</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Nunito:wght@600;700;800;900&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mascot.css">
    <link rel="stylesheet" href="css/lesson.css">
    <script type="module" src="js/lesson.js"></script>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="lesson-header">
        <a class="icon-button" id="close" href="lessons.html" aria-label="Sair da lição">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </a>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="progress"></div></div>
        <span class="combo" id="combo" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>
            <b id="combo-count">0</b>
        </span>
    </header>

    <main class="lesson">
        <div class="lesson-content">
            <h1 id="title">Carregando…</h1>
            <p class="lesson-question" id="question"></p>
            <div id="step"></div>
        </div>
        <div class="lesson-mascot" id="mascot-slot"></div>
    </main>

    <footer class="lesson-footer" id="footer">
        <div class="feedback" id="feedback" role="status" hidden>
            <span class="feedback-icon" aria-hidden="true"></span>
            <div>
                <strong id="feedback-title"></strong>
                <p id="feedback-detail"></p>
            </div>
        </div>
        <button class="button lesson-action" id="action" type="button" disabled>Verificar</button>
    </footer>

    <dialog class="celebration" id="celebration" aria-labelledby="celebration-title">
        <div class="celebration-mascot" id="celebration-mascot"></div>
        <h2 id="celebration-title">Lição completa!</h2>
        <dl class="celebration-stats">
            <div class="stat is-xp"><dt>XP ganho</dt><dd>+<span id="xp-gained">0</span></dd></div>
            <div class="stat is-accuracy"><dt>Precisão</dt><dd><span id="accuracy">0</span>%</dd></div>
        </dl>
        <div class="celebration-actions">
            <a class="button is-ghost" id="repeat" href="lessons.html">Repetir</a>
            <a class="button is-gold" id="next" href="lessons.html">Próxima lição</a>
        </div>
    </dialog>
</body>
</html>
