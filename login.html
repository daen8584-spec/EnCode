<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website description here">
    <title>Login  EnCoder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css\login.css">
    <link rel="stylesheet" href="css\auth.css">
</head>
<body>
    <div class="background" aria-hidden="true">
        <div class="background-orb background-orb-left"></div>
        <div class="background-orb background-orb-right"></div>
        <div class="background-symbols">
            <span class="symbol">&lt;/&gt;</span>
            <span class="symbol">{ }</span>
            <span class="symbol">( )</span>
            <span class="symbol">;</span>
            <span class="symbol">=&gt;</span>
            <span class="symbol">#</span>
        </div>
    </div>
    <main class="login-page">
        <header class="login-header">
            <span class="login-logo">&lt;/&gt;</span>
            <h1 class="login-brand">EnCoder</h1>
        </header>
        <section class="login-card" aria-labelledby="login-title">
            <h2 id="login-title" class="login-title">Login</h2>
            <p class="login-subtitle">Page description here</p>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label class="login-label" for="login-email">Email</label>
                    <input class="login-input" id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="login-label" for="login-password">Senha</label>
                    <input class="login-input" id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="••••••••" required>
                </div>
                <button class="login-button" type="submit" id="login-submit">
                    <span class="login-button-text">Entrar</span>
                    <span class="login-button-loader"></span>
                    <span class="login-button-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12.5l5 5L20 6.5"></path>
                        </svg>
                    </span>
                </button>
                <p id="login-feedback" class="login-feedback" role="alert" hidden></p>
            </form>
            <p class="login-switch">Não tem uma conta? <a href="signup.html">Criar Conta</a></p>
        </section>
    </main>
    <script type="module" src="js\login.js"></script>
</body>
</html>
