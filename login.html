<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Entre no EnCoder e continue aprendendo HTML, CSS e Python.">
    <meta name="theme-color" content="#0f1222">
    <title>Entrar · EnCoder</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Nunito:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <script type="module" src="js/auth-page.js"></script>
</head>
<body>
    <div class="backdrop" aria-hidden="true"><span>&lt;/&gt;</span><span>{ }</span><span>( )</span><span>;</span><span>=&gt;</span><span>#</span></div>

    <main class="auth">
        <p class="brand is-large"><span class="logo">&lt;/&gt;</span>EnCoder</p>

        <section class="auth-card card" aria-labelledby="title">
            <h1 id="title">Entrar</h1>
            <p class="muted">Acesse sua conta para continuar seus estudos.</p>

            <form class="auth-form" data-mode="login" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com"
                        required pattern="[^@\s]+@[^@\s]+\.[^@\s]+" data-error="Digite um email válido." aria-describedby="email-error">
                    <small class="field-error" id="email-error"></small>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <div class="password">
                        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"
                            required data-error="Digite sua senha." aria-describedby="password-error">
                    </div>
                    <small class="field-error" id="password-error"></small>
                </div>
                <button class="button" type="submit">Entrar</button>
            </form>

            <p class="auth-switch">Não tem uma conta? <a href="signup.html">Criar conta</a></p>
        </section>
    </main>
</body>
</html>
